<!doctype html>
<html lang="en-NG">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#14213d" />
    <title>You're offline · Vouchly</title>
    <style>
      :root { color-scheme: light; }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100dvh; display: flex; align-items: center; justify-content: center; padding: 24px 16px; background: #f7f8fa; color: #14213d; font-family: "Manrope Variable", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
      main { width: 100%; max-width: 380px; text-align: center; }
      p.brand { font-size: 22px; font-weight: 800; letter-spacing: -0.02em; margin: 0 0 28px; color: #14213d; }
      .dot { width: 64px; height: 64px; margin: 0 auto 18px; border-radius: 50%; background: #dce4fb; display: flex; align-items: center; justify-content: center; }
      h1 { font-size: 22px; font-weight: 800; margin: 0 0 8px; }
      p { margin: 0 0 10px; font-size: 15px; line-height: 1.5; color: #5b6478; }
      button { margin-top: 18px; width: 100%; height: 52px; border: 0; border-radius: 16px; background: #14213d; color: #fff; font: inherit; font-size: 15px; font-weight: 800; cursor: pointer; }
      .small { margin-top: 14px; font-size: 13px; }
    </style>
  </head>
  <body>
    <main>
      <p class="brand">Vouchly</p>
      <div class="dot" aria-hidden="true">
        <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#2A4BD7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 8.8a15 15 0 0 1 20 0" /><path d="M5 12.5a10 10 0 0 1 14 0" /><path d="M8.5 16a5 5 0 0 1 7 0" /><line x1="12" y1="20" x2="12.01" y2="20" /><line x1="3" y1="3" x2="21" y2="21" /></svg>
      </div>
      <h1>You're offline</h1>
      <p>We can't reach Vouchly right now. Check your data or Wi-Fi.</p>
      <p>Nothing is lost. Your basket and orders are safe.</p>
      <button type="button" id="again">Try again</button>
      <p class="small" id="note">We'll reload this page by itself when you're back online.</p>
    </main>
    <script>
      // Reload as soon as the connection is back, or when they tap the button.
      var again = function () { location.reload(); };
      document.getElementById("again").addEventListener("click", again);
      window.addEventListener("online", again);
    </script>
  </body>
</html>
