services:
  - type: web
    name: vouchly
    runtime: node
    region: frankfurt
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm run db:migrate && npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: SMS_TEST_MODE
        value: "true"
      - key: FOUNDER_INVITE_CODE
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: vouchly-db
          property: connectionString

databases:
  - name: vouchly-db
    region: frankfurt
    plan: free
    databaseName: vouchly
    user: vouchly
